<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dynamic Sudoku</title>
<style>
    :root {
        --bg-color: #f4f7f6;
        --text-color: #333;
        --grid-bg: white;
        --grid-border: #333;
        --cell-border: #bbb;
        --input-text: #1976d2;
        --readonly-bg: #e9ecef;
        --readonly-text: #333;
        --focus-bg: #bbdefb;
        --btn-bg: #333;
        --btn-hover: #555;
        --numpad-bg: #ddd;
    }

    body.dark-mode {
        --bg-color: #1a1a1a;
        --text-color: #f0f0f0;
        --grid-bg: #2d2d2d;
        --grid-border: #888;
        --cell-border: #555;
        --input-text: #64b5f6;
        --readonly-bg: #3d3d3d;
        --readonly-text: #ddd;
        --focus-bg: #1565c0;
        --btn-bg: #555;
        --btn-hover: #777;
        --numpad-bg: #444;
    }

    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 20px 0;
        transition: background-color 0.3s, color 0.3s;
    }

    h2 { margin-bottom: 10px; }

    .top-bar {
        display: flex;
        gap: 15px;
        margin-bottom: 10px;
        align-items: center;
    }

    select, .theme-btn {
        padding: 8px;
        font-size: 14px;
        border-radius: 4px;
        border: 1px solid var(--grid-border);
        background: var(--grid-bg);
        color: var(--text-color);
        cursor: pointer;
    }

    #message { 
        height: 24px; 
        font-weight: bold; 
        margin-bottom: 15px; 
        text-align: center;
    }
    
    table { 
        border-collapse: collapse; 
        border: 3px solid var(--grid-border); 
        background: var(--grid-bg);
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    td { 
        border: 1px solid var(--cell-border); 
        width: clamp(35px, 10vw, 50px); 
        height: clamp(35px, 10vw, 50px); 
        padding: 0;
    }
    td:nth-child(3n) { border-right: 3px solid var(--grid-border); }
    tr:nth-child(3n) td { border-bottom: 3px solid var(--grid-border); }
    
    input { 
        width: 100%; 
        height: 100%; 
        border: none; 
        text-align: center; 
        font-size: clamp(18px, 5vw, 24px); 
        font-family: inherit;
        box-sizing: border-box; 
        cursor: pointer;
        color: var(--input-text);
        background: transparent;
    }
    
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    input[type=text] {
        -moz-appearance: textfield;
    }

    input:focus { 
        outline: none; 
        background: var(--focus-bg); 
    }
    input[readonly] { 
        background: var(--readonly-bg); 
        font-weight: bold; 
        color: var(--readonly-text); 
        cursor: default;
    }

    .numpad {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        margin-top: 20px;
        width: 100%;
        max-width: 350px;
    }

    .numpad button {
        background-color: var(--numpad-bg);
        color: var(--text-color);
        padding: 15px 0;
        font-size: 20px;
        border-radius: 8px;
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 20px;
        max-width: 400px;
    }

    button { 
        padding: 10px 15px; 
        font-size: 16px; 
        font-weight: bold;
        color: white;
        background-color: var(--btn-bg);
        border: none;
        border-radius: 5px;
        cursor: pointer; 
        transition: background 0.2s;
    }
    button:hover { background-color: var(--btn-hover); }
    button.new-btn { background-color: #1976d2; }
    button.reset-btn { background-color: #d32f2f; }
</style>
</head>
<body>
    <h2>Sudoku</h2>
    
    <div class="top-bar">
        <select id="difficulty" onchange="newGame()">
            <option value="30">Easy</option>
            <option value="45" selected>Medium</option>
            <option value="55">Hard</option>
        </select>
        <button class="theme-btn" onclick="toggleTheme()">🌗 Theme</button>
    </div>

    <div id="message"></div>
    
    <table id="grid"></table>
    
    <div class="numpad">
        <button onclick="numPress(1)">1</button>
        <button onclick="numPress(2)">2</button>
        <button onclick="numPress(3)">3</button>
        <button onclick="numPress(4)">4</button>
        <button onclick="numPress(5)">5</button>
        <button onclick="numPress(6)">6</button>
        <button onclick="numPress(7)">7</button>
        <button onclick="numPress(8)">8</button>
        <button onclick="numPress(9)">9</button>
        <button onclick="numPress('')">⌫</button>
    </div>

    <div class="controls">
        <button class="new-btn" onclick="newGame()">New Game</button>
        <button class="reset-btn" onclick="resetGrid()">Reset</button>
    </div>

<script>
    let solution = [];
    let puzzle = [];
    let selectedCell = null;
    const table = document.getElementById("grid");
    const msg = document.getElementById("message");

    if (localStorage.getItem("sudokuTheme") === "dark") {
        document.body.classList.add("dark-mode");
    }

    function toggleTheme() {
        document.body.classList.toggle("dark-mode");
        localStorage.setItem("sudokuTheme", document.body.classList.contains("dark-mode") ? "dark" : "light");
    }

    function saveState() {
        let currentState = [];
        for (let i = 0; i < 9; i++) {
            let row = [];
            for (let j = 0; j < 9; j++) {
                const input = document.getElementById(`cell-${i}-${j}`);
                if (input) {
                    row.push({
                        value: input.value,
                        bgColor: input.style.backgroundColor,
                        color: input.style.color
                    });
                } else {
                    row.push(null);
                }
            }
            currentState.push(row);
        }
        
        const gameData = {
            solution: solution,
            puzzle: puzzle,
            difficulty: document.getElementById("difficulty").value,
            currentState: currentState,
            msgText: msg.innerText,
            msgColor: msg.style.color
        };
        localStorage.setItem('sudokuGame', JSON.stringify(gameData));
    }

    function generateSudoku() {
        solution = Array.from({length: 9}, () => Array(9).fill(0));
        fillDiagonal();
        fillRemaining(0, 3);
        
        puzzle = solution.map(row => [...row]);
        let removeCount = parseInt(document.getElementById("difficulty").value); 
        while (removeCount > 0) {
            let i = Math.floor(Math.random() * 9);
            let j = Math.floor(Math.random() * 9);
            if (puzzle[i][j] !== 0) {
                puzzle[i][j] = 0;
                removeCount--;
            }
        }
    }

    function fillDiagonal() {
        for (let i = 0; i < 9; i += 3) {
            fillBox(i, i);
        }
    }

    function fillBox(rowStart, colStart) {
        let num;
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                do {
                    num = Math.floor(Math.random() * 9) + 1;
                } while (!unUsedInBox(rowStart, colStart, num));
                solution[rowStart + i][colStart + j] = num;
            }
        }
    }

    function unUsedInBox(rowStart, colStart, num) {
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                if (solution[rowStart + i][colStart + j] === num) return false;
            }
        }
        return true;
    }

    function unUsedInRow(i, num) {
        for (let j = 0; j < 9; j++) {
            if (solution[i][j] === num) return false;
        }
        return true;
    }

    function unUsedInCol(j, num) {
        for (let i = 0; i < 9; i++) {
            if (solution[i][j] === num) return false;
        }
        return true;
    }

    function CheckIfSafe(i, j, num) {
        return unUsedInRow(i, num) && unUsedInCol(j, num) && unUsedInBox(i - i % 3, j - j % 3, num);
    }

    function fillRemaining(i, j) {
        if (j >= 9 && i < 8) {
            i = i + 1;
            j = 0;
        }
        if (i >= 9 && j >= 9) return true;
        if (i < 3) {
            if (j < 3) j = 3;
        } else if (i < 6) {
            if (j === Math.floor(i / 3) * 3) j = j + 3;
        } else {
            if (j === 6) {
                i = i + 1;
                j = 0;
                if (i >= 9) return true;
            }
        }
        for (let num = 1; num <= 9; num++) {
            if (CheckIfSafe(i, j, num)) {
                solution[i][j] = num;
                if (fillRemaining(i, j + 1)) return true;
                solution[i][j] = 0;
            }
        }
        return false;
    }

    function renderGrid() {
        table.innerHTML = "";
        selectedCell = null;
        for (let i = 0; i < 9; i++) {
            const tr = document.createElement("tr");
            for (let j = 0; j < 9; j++) {
                const td = document.createElement("td");
                const val = puzzle[i][j];
                
                const input = document.createElement("input");
                input.type = "text";
                input.inputMode = "none";
                input.id = `cell-${i}-${j}`;
                
                if (val !== 0) {
                    input.value = val;
                    input.readOnly = true;
                }

                input.addEventListener('focus', () => {
                    selectedCell = input;
                });

                input.addEventListener('input', () => {
                    input.style.backgroundColor = "";
                    msg.innerText = "";
                    input.value = input.value.replace(/[^1-9]/g, '');
                    if (input.value.length > 1) input.value = input.value.slice(-1);
                    autoCheckWin();
                    saveState();
                });

                input.addEventListener('keydown', (e) => {
                    let r = i, c = j;
                    if (e.key === 'ArrowUp') r = Math.max(0, r - 1);
                    else if (e.key === 'ArrowDown') r = Math.min(8, r + 1);
                    else if (e.key === 'ArrowLeft') c = Math.max(0, c - 1);
                    else if (e.key === 'ArrowRight') c = Math.min(8, c + 1);
                    else if (e.key === 'Backspace') {
                        input.value = "";
                        input.style.backgroundColor = "";
                        input.style.color = "";
                        msg.innerText = "";
                        saveState();
                    }
                    
                    if (r !== i || c !== j) {
                        document.getElementById(`cell-${r}-${c}`).focus();
                        e.preventDefault();
                    }
                });

                td.appendChild(input);
                tr.appendChild(td);
            }
            table.appendChild(tr);
        }
    }

    function numPress(val) {
        if (selectedCell && !selectedCell.readOnly) {
            selectedCell.value = val;
            selectedCell.style.backgroundColor = "";
            selectedCell.style.color = "";
            msg.innerText = "";
            selectedCell.focus();
            autoCheckWin();
            saveState();
        }
    }

    function autoCheckWin() {
        let allCorrect = true;
        let isFull = true;

        for (let i = 0; i < 9; i++) {
            for (let j = 0; j < 9; j++) {
                const input = document.getElementById(`cell-${i}-${j}`);
                if (!input.readOnly) {
                    if (input.value === "") {
                        isFull = false;
                    } else if (input.value != solution[i][j]) {
                        allCorrect = false;
                    }
                }
            }
        }

        if (isFull) {
            if (allCorrect) {
                msg.innerText = "Congratulations! You solved it!";
                msg.style.color = "#4caf50";
                
                for (let i = 0; i < 9; i++) {
                    for (let j = 0; j < 9; j++) {
                        const input = document.getElementById(`cell-${i}-${j}`);
                        if (!input.readOnly) {
                            input.style.backgroundColor = "#4caf50";
                            input.style.color = "white";
                        }
                    }
                }
            } else {
                msg.innerText = "The grid is full, but there are mistakes.";
                msg.style.color = "#f44336";
            }
        }
    }

    function newGame() {
        msg.innerText = "";
        generateSudoku();
        renderGrid();
        saveState();
    }

    function resetGrid() {
        msg.innerText = "";
        for (let i = 0; i < 9; i++) {
            for (let j = 0; j < 9; j++) {
                const input = document.getElementById(`cell-${i}-${j}`);
                if (!input.readOnly) {
                    input.value = "";
                    input.style.backgroundColor = "";
                    input.style.color = "";
                }
            }
        }
        saveState();
    }

    function init() {
        const savedData = localStorage.getItem('sudokuGame');
        if (savedData) {
            const data = JSON.parse(savedData);
            solution = data.solution;
            puzzle = data.puzzle;
            
            const diffSelect = document.getElementById("difficulty");
            if (data.difficulty) diffSelect.value = data.difficulty;
            
            renderGrid();
            
            if (data.currentState) {
                for (let i = 0; i < 9; i++) {
                    for (let j = 0; j < 9; j++) {
                        const input = document.getElementById(`cell-${i}-${j}`);
                        if (input && data.currentState[i][j]) {
                            if (!input.readOnly) {
                                input.value = data.currentState[i][j].value;
                                input.style.backgroundColor = data.currentState[i][j].bgColor;
                                input.style.color = data.currentState[i][j].color;
                            }
                        }
                    }
                }
            }
            
            if (data.msgText) {
                msg.innerText = data.msgText;
                msg.style.color = data.msgColor;
            }
        } else {
            newGame();
        }
    }

    init();
</script>
</body>
</html>
