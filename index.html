<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sudoku</title>
<style>
    body { 
        font-family: sans-serif; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        margin-top: 50px; 
    }
    table { 
        border-collapse: collapse; 
        border: 3px solid black; 
    }
    td { 
        border: 1px solid #999; 
        width: 40px; 
        height: 40px; 
    }
    td:nth-child(3n) { 
        border-right: 3px solid black; 
    }
    tr:nth-child(3n) td { 
        border-bottom: 3px solid black; 
    }
    input { 
        width: 100%; 
        height: 100%; 
        border: none; 
        text-align: center; 
        font-size: 20px; 
        box-sizing: border-box; 
    }
    input:focus { 
        outline: none; 
        background: #e0f7fa; 
    }
    input[readonly] { 
        background: #f0f0f0; 
        font-weight: bold; 
        color: #333; 
    }
    button { 
        margin-top: 15px; 
        padding: 10px 20px; 
        font-size: 16px; 
        cursor: pointer; 
    }
</style>
</head>
<body>
    <h2>Sudoku</h2>
    <table id="grid"></table>
    <button onclick="check()">Check Answers</button>

<script>
    const puzzle = [
        [5,3,0,0,7,0,0,0,0],
        [6,0,0,1,9,5,0,0,0],
        [0,9,8,0,0,0,0,6,0],
        [8,0,0,0,6,0,0,0,3],
        [4,0,0,8,0,3,0,0,1],
        [7,0,0,0,2,0,0,0,6],
        [0,6,0,0,0,0,2,8,0],
        [0,0,0,4,1,9,0,0,5],
        [0,0,0,0,8,0,0,7,9]
    ];

    const solution = [
        [5,3,4,6,7,8,9,1,2],
        [6,7,2,1,9,5,3,4,8],
        [1,9,8,3,4,2,5,6,7],
        [8,5,9,7,6,1,4,2,3],
        [4,2,6,8,5,3,7,9,1],
        [7,1,3,9,2,4,8,5,6],
        [9,6,1,5,3,7,2,8,4],
        [2,8,7,4,1,9,6,3,5],
        [3,4,5,2,8,6,1,7,9]
    ];

    const table = document.getElementById("grid");
    
    for (let i = 0; i < 9; i++) {
        const tr = document.createElement("tr");
        for (let j = 0; j < 9; j++) {
            const td = document.createElement("td");
            const val = puzzle[i][j];
            td.innerHTML = `<input type="number" min="1" max="9" id="cell-${i}-${j}" ${val ? `value="${val}" readonly` : ""}>`;
            tr.appendChild(td);
        }
        table.appendChild(tr);
    }

    function check() {
        for (let i = 0; i < 9; i++) {
            for (let j = 0; j < 9; j++) {
                const input = document.getElementById(`cell-${i}-${j}`);
                if (!input.readOnly) {
                    if (input.value == solution[i][j]) {
                        input.style.backgroundColor = "lightgreen";
                    } else {
                        input.style.backgroundColor = input.value ? "lightcoral" : "white";
                    }
                }
            }
        }
    }
</script>
</body>
</html>
