<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sudoku</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    
    <!-- Full Width Navbar -->
    <nav class="top-navbar">
        <div class="nav-left">
            <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
            <h2>Sudoku</h2>
        </div>
        
        <div class="nav-right">
            <!-- Custom Dropdown -->
            <div class="custom-dropdown" id="difficulty-dropdown">
                <div class="dropdown-selected" onclick="toggleDropdown(event)">
                    <span id="dropdown-text">Medium</span>
                    <svg class="chevron" id="dropdown-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
                <div class="dropdown-options" id="dropdown-options">
                    <div class="dropdown-option" onclick="selectDifficulty(30, 'Easy')">Easy</div>
                    <div class="dropdown-option selected" id="opt-medium" onclick="selectDifficulty(45, 'Medium')">Medium</div>
                    <div class="dropdown-option" onclick="selectDifficulty(55, 'Hard')">Hard</div>
                </div>
                <input type="hidden" id="difficulty" value="45">
            </div>

            <!-- Theme Toggle -->
            <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
                <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg id="sun-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Main Game Area -->
    <div class="main-content">
        <div class="app-container">
            
            <div class="stats-bar">
                <div id="message"></div>
                <div class="timer-box">
                    <span class="timer-label">Time</span>
                    <span id="timer">00:00</span>
                </div>
            </div>
            
            <div class="board-container">
                <table id="grid"></table>
            </div>
            
            <div class="numpad">
                <button onclick="numPress(1)">1</button>
                <button onclick="numPress(2)">2</button>
                <button onclick="numPress(3)">3</button>
                <button onclick="numPress(4)">4</button>
                <button onclick="numPress(5)">5</button>
                <button onclick="numPress(6)">6</button>
                <button onclick="numPress(7)">7</button>
                <button onclick="numPress(8)">8</button>
                <button onclick="numPress(9)">9</button>
                <button onclick="numPress('')" class="del-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                        <line x1="18" y1="9" x2="12" y2="15"></line>
                        <line x1="12" y1="9" x2="18" y2="15"></line>
                    </svg>
                </button>
            </div>

            <div class="controls">
                <button class="new-btn" onclick="newGame()">New Game</button>
                <button class="reset-btn" onclick="resetGrid()">Reset</button>
            </div>
        </div>
    </div>

    <!-- Copyright Footer -->
    <footer class="app-footer">
        <p>&copy; 2026 Sudoku. All rights reserved.</p>
    </footer>

    <!-- Victory Modal -->
    <div id="victory-modal" class="modal">
        <div class="modal-content">
            <h2>Congratulations! 🎉</h2>
            <p>You solved this puzzle in <span id="victory-time"></span></p>
            <button onclick="closeModalAndNewGame()">Play Again</button>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
